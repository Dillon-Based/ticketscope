# Reusable: build images (runner arch) -> scripts/kind-up.sh -> run the caller's check.
# The cluster dies with this job, so the caller passes its check as a command (AD-17).
name: _kind-deploy

on:
  workflow_call:
    inputs:
      check:
        description: Shell command run after kind-up.sh, against the live cluster.
        type: string
        required: true
      upgrade_check:
        description: >-
          Optional shell command run once after a second kind-up.sh on the same cluster
          (an in-place upgrade), when `check` passed.
        type: string
        required: false
        default: ""
      eval_enabled:
        description: >-
          Render the eval Job, a Helm hook after load (kind-up.sh EVAL_ENABLED=1).
          Only eval.yml sets it.
        type: boolean
        required: false
        default: false
      base_sha:
        description: >-
          PR base commit. When set, it is fetched (the checkout is depth 1) and exported to
          the check as BASE_SHA, so a check can diff against it. Only eval.yml sets it.
        type: string
        required: false
        default: ""
      enabled:
        description: >-
          Run the deploy job. False skips it, and a skipped `deploy` still reports its own
          check (`<caller> / deploy`), so a required check of that name is satisfied.
          Callers set it from .github/kind-paths.yml.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

env:
  KIND_VERSION: v0.33.0
  KUBECTL_VERSION: v1.36.4
  HELM_VERSION: v4.3.1

jobs:
  deploy:
    if: inputs.enabled
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the PR base commit
        if: inputs.base_sha != ''
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: Start runner-fit sampler
        run: |
          # Used memory (MemTotal - MemAvailable, MiB) every 2s, for the summary.
          nohup bash -c 'while true; do
            awk "/^MemTotal:/{t=\$2} /^MemAvailable:/{a=\$2} END{print int((t-a)/1024)}" /proc/meminfo
            sleep 2
          done' > /tmp/mem-used-mib.log 2>/dev/null &

      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kind and kubectl
        run: |
          arch=$(uname -m); case "$arch" in x86_64) arch=amd64;; aarch64) arch=arm64;; esac
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo "$HOME/.local/bin/kind" "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-${arch}"
          curl -fsSLo "$HOME/.local/bin/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${arch}/kubectl"
          chmod +x "$HOME/.local/bin/kind" "$HOME/.local/bin/kubectl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: kind-up
        run: scripts/kind-up.sh
        env:
          TAG: ${{ github.sha }}
          EVAL_ENABLED: ${{ inputs.eval_enabled && '1' || '0' }}

      - name: Check
        env:
          CHECK: ${{ inputs.check }}
          BASE_SHA: ${{ inputs.base_sha }}
          # The Postgres image kind-up.sh built, for tests/smoke/test_time_load.py.
          POSTGRES_IMAGE: ticketscope-postgres:18-${{ github.sha }}
        run: bash -c "$CHECK"

      - name: In-place upgrade, then check once
        if: inputs.upgrade_check != ''
        env:
          TAG: ${{ github.sha }}
          EVAL_ENABLED: ${{ inputs.eval_enabled && '1' || '0' }}
          CHECK: ${{ inputs.upgrade_check }}
          POSTGRES_IMAGE: ticketscope-postgres:18-${{ github.sha }}
        run: |
          # Keep the fresh cluster's kind-up-to-Ready time for the runner-fit summary;
          # kind-up.sh would otherwise export the upgrade's time over it.
          fresh="${TICKETSCOPE_KIND_UP_TO_READY_SECONDS:-}"
          scripts/kind-up.sh
          echo "TICKETSCOPE_KIND_UP_TO_READY_SECONDS=${fresh}" >> "$GITHUB_ENV"
          bash -c "$CHECK"

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods,svc,jobs -A -o wide || true
          kubectl get gateway,httproute -A -o yaml || true
          kubectl -n ticketscope get clusters.postgresql.cnpg.io -o yaml || true
          kubectl -n ticketscope get backups.postgresql.cnpg.io,objectstores.barmancloud.cnpg.io -o yaml || true
          # Every pod in the two releases' namespaces: events, then current and
          # previous logs of each container, so a crash loop shows its cause.
          for ns in platform ticketscope; do
            for pod in $(kubectl -n "$ns" get pods -o name 2>/dev/null); do
              echo "::group::$ns $pod"
              kubectl -n "$ns" describe "$pod" | sed -n '/^Containers:/,$p' || true
              kubectl -n "$ns" logs "$pod" --all-containers --tail=200 || true
              echo "--- previous ---"
              kubectl -n "$ns" logs "$pod" --all-containers --previous --tail=200 || true
              echo "::endgroup::"
            done
          done
          docker logs ticketscope-cloud-provider-kind 2>&1 | tail -100 || true

      - name: Runner-fit summary
        if: always()
        run: |
          peak=$(sort -n /tmp/mem-used-mib.log 2>/dev/null | tail -1)
          total=$(awk '/^MemTotal:/{print int($2/1024)}' /proc/meminfo)
          disk=$(df -h --output=avail / | tail -1 | tr -d ' ')
          if [[ -n "${TICKETSCOPE_KIND_UP_TO_READY_SECONDS:-}" ]]; then
            wall="${TICKETSCOPE_KIND_UP_TO_READY_SECONDS}s"
          else
            wall="n/a (api never became Ready)"
          fi
          {
            echo "### Runner fit (kind)"
            echo
            echo "| Measure | Value |"
            echo "| --- | --- |"
            echo "| Peak memory used | ${peak:-n/a} MiB of ${total} MiB |"
            echo "| Free disk on / | ${disk} |"
            echo "| Wall clock, kind-up start to api Ready | ${wall} |"
            echo
            echo "Wall clock is measured by scripts/kind-up.sh and includes its image builds."
            if [[ "${{ inputs.eval_enabled }}" == true ]]; then
              echo "With eval enabled, this wall clock also includes the eval Job (a Helm hook kind-up waits on)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          mkdir -p reports
          printf '{"peak_memory_mib": "%s", "total_memory_mib": "%s", "free_disk": "%s", "kind_up_to_api_ready_seconds": "%s"}\n' \
            "${peak:-n/a}" "$total" "$disk" "${TICKETSCOPE_KIND_UP_TO_READY_SECONDS:-n/a}" > reports/runner-fit.json

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-kind
          path: reports/
          if-no-files-found: ignore
