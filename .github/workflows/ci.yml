# PR CI (AD-17): lint, types, import-linter, unit tests, chart lint, the epic's
# integrated check on one kind deploy (integrated suite, then smoke, on the same cluster,
# then one smoke pass after an in-place kind-up.sh upgrade), multi-arch image builds when
# images change or on dispatch, and the run's trace live-verification results. `checks` also
# fails when the README results table drifts from eval/baseline.json.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v4.3.1

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: pyright
        run: uv run pyright
      - name: import-linter
        run: uv run lint-imports
      - name: pytest
        run: uv run pytest --junitxml=reports/unit.xml
      - name: README results table
        run: python3 scripts/render_readme_table.py --check
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-unit
          path: reports/
          if-no-files-found: ignore

  charts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: helm lint
        run: |
          # `dependency build` resolves non-OCI repos only through `helm repo add`.
          helm repo add cnpg https://cloudnative-pg.github.io/charts --force-update
          helm repo add seaweedfs https://seaweedfs.github.io/seaweedfs/helm --force-update
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts --force-update
          helm repo add grafana-community https://grafana-community.github.io/helm-charts --force-update
          helm dependency build deploy/charts/platform
          helm lint deploy/charts/platform -f deploy/charts/platform/values-kind.yaml
          helm lint deploy/charts/ticketscope -f deploy/charts/ticketscope/values-kind.yaml \
            --set-string image.app.tag=lint --set-string image.postgres.tag=18-lint
      # The platform-chart renders need the dependencies built above.
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - name: chart render tests
        run: >-
          uv run pytest tests/unit/test_chart_backup.py tests/unit/test_chart_telemetry.py
          tests/unit/test_chart_eval.py tests/unit/test_chart_embeddings.py

  changes:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.filter.outputs.images }}
      kind: ${{ steps.kind.outputs.kind }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            images:
              - 'images/**'
      # The kind deploy runs only when a path it depends on changed (.github/kind-paths.yml).
      - uses: dorny/paths-filter@v4
        id: kind
        with:
          filters: .github/kind-paths.yml

  images:
    # AD-16: both images for both arches, on native runners (no QEMU). A manual dispatch
    # builds them too, so the multi-arch build can be verified at any commit.
    needs: changes
    if: needs.changes.outputs.images == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build app image (${{ matrix.platform }})
        run: >-
          docker build --platform ${{ matrix.platform }}
          -f images/app.Dockerfile -t ticketscope-app:${{ github.sha }} .
      - name: Build postgres image (${{ matrix.platform }})
        run: >-
          docker build --platform ${{ matrix.platform }}
          -f images/postgres.Dockerfile -t ticketscope-postgres:18-${{ github.sha }} .

  integrated-check:
    # One kind cluster per PR. The integrated suite runs first, on the freshly deployed
    # state, before smoke's upgrades and forced reloads.
    needs: changes
    uses: ./.github/workflows/_kind-deploy.yml
    with:
      # Skipped inside the reusable workflow, so the check still reports as
      # `integrated-check / deploy`. A manual dispatch always runs it.
      enabled: ${{ needs.changes.outputs.kind == 'true' || github.event_name == 'workflow_dispatch' }}
      check: uv run pytest -m kind tests/integrated tests/smoke --junitxml=reports/kind.xml
      # Story 10 AC-4: the first smoke run after an in-place upgrade passes (3).
      upgrade_check: uv run pytest -m kind tests/smoke --junitxml=reports/kind-upgrade.xml

  evidence:
    # Trace live-verification results for this run (bmad-tea-trace input). Runs whatever
    # the other jobs did, so a failure is recorded as `fail`, never left out.
    needs: [checks, charts, changes, images, integrated-check]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: reports-*
          path: reports
          merge-multiple: true
      - name: Resolve the commit the run verified
        id: source
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A PR run checks out the merge ref. Record the PR head only when the merge tree
          # equals it (base already in head); otherwise record the merge commit itself.
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          if git diff --quiet "$HEAD_SHA" HEAD; then sha="$HEAD_SHA"; else sha="$(git rev-parse HEAD)"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Recording results against $sha (checked out $(git rev-parse HEAD))"
      - name: Build live-verification-results.json
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        run: >-
          python3 scripts/live_results.py --sha "$SOURCE_SHA"
          --run-url "$RUN_URL" --needs "$NEEDS" --reports reports
          --producer "GitHub Actions ci run $RUN_ID (scripts/live_results.py)"
          --out live-verification-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: live-verification-results
          path: live-verification-results.json
