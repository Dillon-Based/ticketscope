[[entry]]
id = 11
type = "story"
title = "Integrated check on EKS"
description = "Adds env-check.yml, a dispatched workflow that runs env-up, its smoke check, env-down and the leftover check in sequence on one SHA and ends clean, and a short results record. The workflow is the integrated check the epic's Done when asks for; the cheap PR gate is story 5's. The drills are evidenced by stories 7, 8 and 9, and the month's billing figure by a person at closure, since a month has to pass (R5)."
verify = "The agent dispatches env-check.yml on a SHA with gh; it finishes green with env-up under 30 minutes from the start of terraform apply and the leftover check clean (R1, R3, R4); the epic's Notes cite its run URL as the CI evidence and link the restore, failure and recreate records (R9, R10, R11); the epic's Notes record the billing figure for the month that holds these runs, the bootstrap layer and the domain included, under $10 (Cost Explorer's month-to-date if the month has not closed) (R5); the epic closes with every Done when line backed by a story's evidence (R1, R2, R3, R4, R5, R6, R7, R8, R9, R10, R11); the billing figure is recorded amortised (the domain's annual fee divided by 12) and also as the raw Cost Explorer figure (R5)."
covers = ["R1", "R2", "R3", "R4", "R5", "R6", "R7", "R8", "R9", "R10", "R11"]
