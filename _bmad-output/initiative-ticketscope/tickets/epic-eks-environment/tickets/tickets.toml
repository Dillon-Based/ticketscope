# epic-eks-environment stories, in build order. `id` is permanent, never reused.
# Lane: 1 → 2 → 3 → 4 → 6 → 7 → 9 is one lane, because each edits infra/env, values-eks.yaml or the env workflows.
# 1 is setup and the bootstrap layer; only a person can create the account and buy the domain.
# 2 is the tracer: the real page and /mcp over HTTPS from an applied environment, run by hand once, so the
#   unproven Gateway, ACM and external-dns chain (AD-14) fails here and not later. It commits the deploy script
#   story 3's workflow calls, so nothing is thrown away.
# 5 (PR gate) and 8 (failure drill) run beside the lane after their prerequisites.
# Hitl: the unattended loop holds no AWS write credentials. A person runs what creates AWS resources by hand
#   (stories 1, 2, 6, 7, 8) and the first env-up (3), because no teardown automation exists until story 4.
#   From story 4 on, the agent dispatches the env workflows with `gh` (user, 2026-11-12) and reads results, and
#   uses a read-only AWS profile made in story 1 to check them. Each such story has a done_checkpoint, and
#   every environment carries an expiry of at most 4 hours.
# Sizing (epic-search-baseline retro): each story fits one agent session; one likely to add more than about
#   800 lines is flagged in its notes for the independent review.
# Cost: every AWS run is an env-hour ($0.22 to $0.32 each). A story that needs a live environment says so, and
#   the person tears it down with env-down (story 4) or, before it exists, by hand in the order of AD-24.

[[entry]]
id = 1
type = "story"
title = "Tracer setup: the AWS account and bootstrap layer exist"
description = "A person creates the AWS account on the advanced sign-up path, moves it to the Paid plan, turns on MFA for the root user, makes an admin identity for the one-time apply, and buys the domain in Route53 with a card (credits cannot pay for it). The agent writes infra/bootstrap in Terraform: the hosted zone read from the registered domain, one ACM certificate for the fixed hostname validated by DNS in that zone, the GitHub OIDC provider and a deploy role that trusts only this repo's main branch and a named environment, one S3 bucket for Terraform state and database backups with a lifecycle rule and public access blocked, ECR repositories for the app and Postgres images that keep the last 10, and an AWS Budgets alarm at $8 a month. A read-only IAM role (ReadOnlyAccess plus billing view) is created for the agent's AWS profile, assumable from the person's admin identity; the profile's configuration stays on the person's machine and out of the repo. The alert email and account details are Terraform variables that stay out of the repo. The deploy role's permissions cover what the env stack and the workflows need and nothing for the bootstrap layer. The person applies bootstrap locally once. How bootstrap's own state is kept (a local file or migrated into its bucket) is decided in the plan. Terraform fmt and validate run in ci.yml for infra/bootstrap."
verify = "A person applies bootstrap; a second terraform plan shows no changes (R2); the certificate's status is ISSUED for the fixed hostname and the zone's name servers match the registered domain, checked by dig (R2); the budget alarm at $8 exists (R5); a dispatched workflow assumes the deploy role through OIDC and prints the caller identity while the repo's secrets and variables list no AWS credential (R6); a test on the rendered trust policy shows it names this repo and its main branch or environment and no wildcard (R6); under the read-only profile, aws sts get-caller-identity works and a write call (creating a bucket) is denied (R6); the bucket blocks public access and the ECR repositories keep 10 images, read back from the AWS CLI (R2); ci.yml runs terraform fmt and validate for infra/bootstrap and passes; .gitignore covers Terraform state, plan files, .terraform/ and *.tfvars, and a scan of tracked files finds no account id, key pattern or email (R6); tests on the rendered deploy-role trust policy and the backup prefix's scope are written before the build (R6); the read-only profile can run IAM policy simulation and read Cost Explorer (R5, R6); the deploy role trusts a named GitHub environment whose branch rule admits story branches (R6)."
covers = ["R2", "R5", "R6"]
after = []
hitl = true # a person creates the account, buys the domain and applies bootstrap
risk = "high"
plan_checkpoint = true
notes = ["Create the AWS account before this story starts, in parallel with epic 4: verification can take up to 24 hours and some reports run to days (research). Choose the advanced sign-up path so the account's region is not pinned to the contact country's, and pick us-east-1.", "Record in the plan the plan and credit terms the console shows for the new account, and whether the signup credits cover EKS (the epic's open question); it does not gate the build."]

[[entry]]
id = 2
type = "story"
title = "Tracer: the page and /mcp answer over HTTPS on the fixed hostname from an applied environment"
description = "Lays the thinnest path through every layer. Adds infra/env in Terraform, reading bootstrap's outputs: a VPC with public subnets in two zones and no NAT, EKS 1.36 from terraform-aws-modules/eks 21 on standard support, a managed node group of two t4g.medium arm64 nodes, the vpc-cni and ebs-csi add-ons, and IRSA roles for the AWS Load Balancer Controller and external-dns. State is kept in the bootstrap bucket, and every resource carries an environment tag for the leftover check. Adds deploy/charts values-eks.yaml for both charts with environment facts only: hostname, the ALB gateway class, the gp3 storage class, replica counts and auth off. The platform chart gains the AWS Load Balancer Controller and external-dns as EKS-only dependencies, a LoadBalancerConfiguration naming the bootstrap certificate by explicit ARN, an internet-facing scheme and a TargetGroupConfiguration with target type ip. The workflow-side install of the standard-channel Gateway API CRDs and the controller's own CRDs comes first, because the controller's chart ships neither. Adds scripts/eks-deploy.sh, which installs the CRDs, then platform, then ticketscope for a kubeconfig and image tag; story 3's workflow calls it. A person pushes the SHA-tagged multi-arch images to ECR, runs terraform apply and the script from their machine, and times each stage. The pinned snapshot and embeddings load through the chart's existing load hook, so nothing is embedded. The same person tears the environment down by hand: delete the Gateway and wait for its ALB, uninstall platform, then terraform destroy."
verify = "A person applies env and runs eks-deploy.sh; https://<fixed hostname>/ serves the search page under the bootstrap certificate and a search returns ranked issues with outcomes (R1, R2); an MCP client lists tools and calls search_similar_issues at https://<fixed hostname>/mcp (R1); external-dns wrote the hostname's record, shown by dig (R2); the plan records the time of each stage, which certificate mode the controller used and whether the external-dns target annotation was needed, answering AD-14's open question (R1); render tests show values-eks.yaml holds only the environment keys of AD-25 and the kind release still renders and passes mcp-e2e.yml (R7); terraform fmt and validate for infra/env run in ci.yml and pass (R7); after the hand teardown, a tag-scoped list shows no ALB, ENI, volume or security group left (R3); the AWS Load Balancer Controller's default-tag setting and the EBS CSI extra-volume-tag setting are set, and the leftover check's list finds the ALB, a target group, the security group and the volumes while the environment is up (R3); real aws list output for the environment, up and after teardown, is captured with ids masked and committed as fixtures for story 4 (R3); the plan records requests, limits and node memory headroom (R7); the EKS API endpoint is public and IAM-authenticated, and the node security groups admit no inbound internet traffic except the load balancer's listener ports (R3)."
covers = ["R1", "R2", "R3", "R7"]
after = [1, "1.11", "3.8"]
hitl = true # a person pushes images, applies env, runs the deploy script and times it
risk = "high"
plan_checkpoint = true
notes = ["Needs epic 1's integrated kind check and epic 3's chart defaults and embedding assets, which size the nodes. Start at t4g.medium; move to t4g.large only if the platform pods and two database instances do not fit in 8 GiB.", "Likely more than 800 added lines (infra/env, two values files, platform chart templates, script, tests): run the independent review on it; if the plan estimates well over 800 lines, split at the plan checkpoint, infra/env and the hand-run first, then the EKS values and chart templates.", "If external-dns cannot read the ALB address from the Gateway, use the external-dns.kubernetes.io/target annotation on the Gateway and record it. If neither works, stop and replan; do not add a second ALB or an Ingress (AD-14).", "Image push is by hand here (docker buildx to ECR with the person's admin identity); story 3's workflow takes it over."]

[[entry]]
id = 3
type = "story"
title = "env-up deploys through OIDC and records its time"
description = "Adds env-up.yml, a dispatched workflow that assumes the deploy role through OIDC with no stored key. It takes a git SHA and an expiry in hours (default 4). A first job builds and pushes the multi-arch app and Postgres images to ECR tagged with that SHA, skipped when they exist; its time is outside the clock. The timed jobs then run terraform apply for env with an expiry tag, call scripts/eks-deploy.sh, and finish with a smoke check from tests/: a search on the page and an MCP client call, both over the public hostname. The workflow starts its clock at the start of terraform apply, stops it when the smoke check passes, and writes the time of each stage to the job summary and an artifact. A failed smoke check fails the run and leaves the environment up for the expiry sweep. The scripts and tests it adds reuse story 2's."
verify = "A person dispatches env-up on a SHA; it finishes with the page and /mcp answering over HTTPS and the corpus loaded, and the recorded wall-clock time from the start of terraform apply is under 30 minutes (R1); the summary lists the time of each stage (R1); the repo's secrets and variables list no AWS credential and the run assumed the role through OIDC (R6); the environment carries an expiry tag set from the input (R4); a smoke check that fails turns the run red (R1); a second dispatch for a SHA whose images exist skips the build job (R1); the smoke check compares the issue count with the pinned snapshot's manifest count (R1); dns_visible is measured against the zone's name servers before the public resolver is polled (R1); the plan states whether the live run is from the branch through the named environment or after merge (R1, R6)."
covers = ["R1", "R4", "R6"]
after = [2, "4.7"]
hitl = true # a person dispatches the run and records the time
risk = "high"
plan_checkpoint = true
notes = ["Stays hitl: this is the first env-up and env-down does not exist yet, so a person tears the environment down by hand in AD-24's order, or it falls to the expiry sweep once story 4 lands.", "Waits on epic 4's integrated check (4.7) so the smoke check's MCP call tests the settled server; no auth yet, epic 6 adds it.", "If the run takes 30 minutes or more, the stage times show where. Record them and the proposed fix as a Decision in the epic's Notes before changing the target; the target moves only with the user (R1).", "The apply is the long stage: the control plane alone takes about 10 to 15 minutes. Do not add waits that only serve a test."]

[[entry]]
id = 4
type = "story"
title = "env-down tears down in order, finds nothing left, and expires forgotten environments"
description = "Adds env-down.yml, dispatched and on a schedule, and scripts/leftover-check.sh. The ordered teardown runs AD-24's steps: helm uninstall ticketscope, delete the PVCs, delete the Gateway and wait until its ALB is gone while the controller still runs, helm uninstall platform, wait for tagged ENIs and EBS volumes to go, terraform destroy for env, then the leftover check. The check lists, by the environment tag, any ALB, target group, ENI, EBS volume, security group, KMS key and CloudWatch log group, and fails the job if any remains outside Terraform state; bootstrap is never touched. The schedule runs hourly, reads the expiry tag that story 3's env-up sets on each environment, and tears down any that has expired. A stuck Gateway is reported with its finalizer and the remedy, and the job fails rather than force-deleting."
verify = "The agent dispatches env-up then env-down with gh and reads the runs; the teardown finishes in the order of AD-24 and the leftover check passes with nothing left but bootstrap, which the agent confirms again under the read-only profile (R3); the check fails and names a leftover in a unit test that injects a tagged resource into recorded AWS list output, and in a dry-run mode that does the same (R3); an environment brought up with a 15-minute expiry is destroyed by the scheduled run with no dispatch, observed by the agent (R4); the check never lists or deletes a bootstrap resource, shown by a unit test on its filters (R3); ci.yml passes (R3); the check, run while the environment is up, lists the Gateway's ALB, a target group, the security group and the PVC volumes (R3); IAM policy simulation of the deploy role against the bootstrap ARNs is denied, and terraform plan -lock=false of bootstrap shows no change after env-down (R3); the scheduled expiry is observed after merge, and an environment is destroyed within its expiry plus one sweep period plus teardown time (R4)."
covers = ["R3", "R4"]
after = [3]
hitl = false # the agent dispatches with gh and checks under the read-only profile
risk = "high"
plan_checkpoint = true
done_checkpoint = true # pause after it: from here on the agent spends env-hours
notes = ["The agent dispatches only environments with an expiry of at most 4 hours and runs no more than one environment at a time; it never runs write commands against AWS or the cluster outside the workflows.", "If the controller is uninstalled before the Gateway is gone, the Gateway stays stuck and AWS resources remain (research, source reading). The Gateway deletion step must complete first; the plan states how it waits and how long it gives up after.", "Leave the controller flag manage-backend-security-group-rules at its default: with it false, an open controller issue leaks a security group.", "The red-mode tests for bootstrap protection and the leftover check's filters exist before the build, so the build session does not author its own oracle (test design, epic 5)."]

[[entry]]
id = 5
type = "story"
title = "A PR check renders both environments and validates Terraform"
description = "Adds to ci.yml a check that runs with no AWS access: helm template for both charts with values-kind.yaml and values-eks.yaml under the pinned Helm, a test that fails when an environment file sets a product default or the snapshot pin (AD-25), and a terraform plan of infra/env that needs no credentials (a mocked provider or a plan-only mode, whichever the plan finds works); fmt and validate are already in ci.yml from stories 1 and 2. The kind path filter in .github/kind-paths.yml gains infra/** and deploy/charts/** only where the kind jobs need them. Tests live beside the existing chart tests and are listed in the charts job."
verify = "On a PR, ci.yml renders both charts with each environment file and passes (R7); a values-eks.yaml that overrides retrieval.defaultMode, the api resources or the snapshot pin fails the check (R7); a terraform plan of infra/env runs in the job with no AWS credential and fails on a deliberately broken module in a test (R7); a PR that touches only infra/** does not start the kind deploy (R7); ci.yml and mcp-e2e.yml still pass for the kind path (R7); the allowlist names the keys AD-25 lists plus the IRSA role annotation and the instance placement rule, and a key outside it fails (R7); the EKS render has no kind stand-in hostname and mcp's allowed hosts hold the live hostname and no wildcard (R7)."
covers = ["R7"]
after = [2]
hitl = false
risk = "low"

[[entry]]
id = 6
type = "story"
title = "CloudNativePG backs up to the bootstrap bucket through an IRSA role"
description = "Wires backups on EKS. The env stack creates the backup IRSA role for the Cluster's service account, trusting that cluster's OIDC provider, with a policy on the bootstrap bucket's prefix: Put, Get, Delete (for retention) and the multipart actions on objects, and List on the bucket with a prefix condition. The Barman Cloud Plugin is pinned to 0.16.0 or later. The ticketscope chart's ObjectStore reads its endpoint, bucket and prefix from values, and sets inheritFromIAMRole with the role's ARN on the service account template for EKS; kind keeps its SeaweedFS static credentials. The Cluster's plugin entry takes serverName from a value that env-up sets per incarnation, and the Cluster leaves spec.serviceAccountName unset. env-up passes the incarnation id and the role ARN through to the release. Scheduled backups are on and one on-demand backup is triggered."
verify = "A person runs env-up; the Cluster archives WAL and an on-demand backup completes with status completed on EKS, and its objects are under the incarnation's prefix in the bootstrap bucket (R8); with an IAM policy limited to the candidate actions, a backup, a restore read and a retention delete each succeed, and the exact set that was needed is recorded in the plan (R8); the pods hold no AWS key and the Cluster has no skipEmptyWalArchiveCheck annotation (R6); render tests show the EKS values set the role annotation and serverName and the kind values still use SeaweedFS (R6, R8); the kind backup check from epic 1 still passes in CI (R8); IAM policy simulation of the backup role is denied on the Terraform state prefix (R6); the namespace's Secret names and the plugin Role's rules are recorded (R8)."
covers = ["R6", "R8"]
after = [4]
hitl = true # a person runs env-up and the backup
risk = "medium"
plan_checkpoint = true
notes = ["No document publishes the minimum IAM policy; the candidate set is inferred from the AWS multipart-upload docs and Barman and is untested. Start from it and tighten against failures, recording what was needed.", "Pod Identity is the fallback if IRSA fails on the first recreate; it is not the plan (epic Notes, 2026-11-12).", "Plugin issue 892 grants read access to every Secret in the namespace when inheritFromIAMRole is on; it is acceptable in this single-purpose namespace and is recorded, not fixed here.", "Runs after story 4 so every environment the drills create can be torn down by env-down."]

[[entry]]
id = 7
type = "story"
title = "A backup is restored into a new cluster and the drill is recorded"
description = "Adds scripts/restore-drill.sh and docs/drills/restore-drill.md. The script takes a backup on EKS, creates a recovery Cluster under a new name with bootstrap.recovery reading the source's serverName through externalClusters and the plugin, waits for it, and compares the source and restored corpus_meta and issue counts. The record keeps the commands, their output with account ids and hostnames that are not public masked, the timings and the result. A recovered cluster that must archive gets its own plugins entry and ObjectStore path."
verify = "A person runs the drill on a live environment; the restored cluster's corpus_meta equals the source's and its issue count matches (R9); docs/drills/restore-drill.md is committed with the commands, output and timings and contains no account id or credential, checked by a test that greps the file (R9); the script exits non-zero when the counts differ, shown by a unit test on its comparison (R9); an ordered digest of issue numbers matches between source and restored cluster, and the counts equal the pinned manifest's (R9)."
covers = ["R9"]
after = [6]
hitl = true # a person runs the drill
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "An instance failure is survived and the drill is recorded"
description = "Adds scripts/failure-drill.sh and docs/drills/failure-drill.md. values-eks.yaml requires the two CloudNativePG instances to run on different nodes. The script starts a probe that searches through the public hostname every second, terminates the node holding the primary, and records when a standby is promoted, when the probe next succeeds and how many requests failed in between. The record keeps the commands, timings and result with identifying values masked. If the open plugin bug on failover with two instances archiving to one archive (#828) bites, the drill records exactly what failed and the story proposes the fix or the limit; it does not weaken the drill to one instance."
verify = "A person runs the drill on a live environment; a standby is promoted and the public search probe succeeds again, and the recovery time and failed-request count are recorded (R10); the two instances were on different nodes before the failure, shown by the record (R10); docs/drills/failure-drill.md is committed with no account id or credential, checked by a grep test (R10); render tests show the EKS values require the two instances on different nodes and the kind values do not (R10); after promotion the Cluster's archive status shows no error and archiving continues under one serverName (R10)."
covers = ["R10"]
after = [6]
hitl = true # a person runs the drill and terminates the node
risk = "high"
plan_checkpoint = true
notes = ["Initiative R3 asks for an instance failure survived. A one-instance drill would not satisfy it, so a failure of the two-instance case is a finding to resolve, not a reason to drop the second instance.", "Run in the same environment window as stories 6 and 7, the node loss last, to save environment-hours (test design C-8, 2026-11-12)."]

[[entry]]
id = 9
type = "story"
title = "A recreated environment backs up to and restores from the same bucket"
description = "Proves the destroy-and-recreate path that makes the design work. env-up takes an optional restore-from input, the previous incarnation's serverName; unset, it loads from the snapshot as before. The new incarnation gets its own serverName and archives under it, and with restore-from set its Cluster bootstraps by recovery from the previous prefix. env-down takes an optional backup_first input that takes an on-demand backup inside the workflow and waits for it before teardown, and the smoke step prints corpus_meta and the issue count into the job summary, so the agent needs no cluster write access. The agent dispatches the sequence: env-up, env-down with backup_first, then env-up again with the same cluster name against the same bucket and restore-from set. The record in docs/drills keeps the dispatches, both incarnations' serverNames and the result."
verify = "After the agent's env-up, env-down with backup_first and a second env-up with restore-from, the second environment archives WAL under its own serverName with no 'Expected empty archive' failure and no skipEmptyWalArchiveCheck, and its corpus_meta and issue count equal the first's (R11); both environments served the same hostname under the same bootstrap certificate (R2); the record is committed with no account id or credential, checked by a grep test (R11); an env-up dispatched with the same incarnation id as an existing prefix is refused before terraform apply, shown by a unit test on the workflow's input check (R11); the first incarnation's archive objects are unchanged by the second environment (R11)."
covers = ["R2", "R11"]
after = [4, 7]
hitl = false # the agent dispatches the sequence with gh
risk = "high"
plan_checkpoint = true
done_checkpoint = true
notes = ["The same-name failure rests on one open plugin issue (767) reported on older versions and has not been reproduced on current ones, so the first recreate may or may not fail without the serverName change; run it once without the change on a spare incarnation only if the plan finds it cheap, and record the result either way."]

