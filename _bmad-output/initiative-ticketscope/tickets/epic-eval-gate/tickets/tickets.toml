# epic-eval-gate stories, in build order. `id` is permanent, never reused.
# One lane: every story touches jobs/eval, the eval Job or eval.yml, so each waits on the one before.
# Shared setup (jobs/eval package, image contents, the eval Job in the ticketscope chart, eval.yml) is owned by story 1, the tracer.
# Sizing (epic-search-baseline retro): each story fits one agent session; one likely to add more than
# about 800 lines is flagged in its notes for the independent review.
# Tests: each story writes the tests test-design-epic-2.md assigns it (Owner column). Before stories 1 and 2
# build, a bmad-tea-automate red-mode session commits their independent oracles (epic Notes, 2026-11-08).

[[entry]]
id = 1
type = "story"
title = "Tracer: keyword is scored on kind and CI uploads the results"
description = "Lays the thinnest path from snapshot to CI artifact. A pure core function derives one pair per duplicate issue whose core.duplicate_target is in the pinned schema-v2 snapshot, counted under the duplicate issue's kind (spine AD-26; query = the duplicate issue, target = its duplicate_target), and a script commits it as eval/pairs/2026.11.1.jsonl, deterministic and sorted, reporting the pair count for short and log-heavy queries. jobs.eval (a ticketscope-eval entry point in pyproject.toml) connects as ticketscope_ro through the Postgres adapter and the existing read-only Secret, reads each query's title and description from the loaded corpus through CorpusStore, builds every mode in core.modes.REGISTRY whose `available` holds, and scores each query with the query issue excluded, computing Recall@10 and MRR@10 against the linked target only (the epic's interim-relevance Decision; story 2 brings the cluster). Its results JSON records the corpus_meta snapshot version, embedding model id and preprocessing version (spine AD-21) beside the metrics. The app image ships eval/pairs. The ticketscope chart gains the eval Job, rendered only when eval.enabled is set (spine AD-22) and run after load (a later hook weight, or started by eval.yml once load has finished); kind-up.sh gains a way to set eval.enabled. eval.yml runs on PRs through _kind-deploy.yml, runs the Job and, through _kind-deploy's artifact step, uploads the results JSON before the cluster goes, even when a later step fails (spine AD-13, AD-17); ci.yml's integrated-check keeps passing on the changed reusable workflow. The red-mode oracle fixture committed before the build is not edited by it."
verify = "On a PR, eval.yml deploys to kind, runs the eval Job after load as ticketscope_ro, and uploads a results artifact with keyword's Recall@10 and MRR@10 over every pair plus the corpus lineage, and the artifact is uploaded even when a later step fails (R2); the target-only metrics match the hand-computed oracle committed before the build (R2); ci.yml's integrated-check still passes on the same PR; regenerating eval/pairs/2026.11.1.jsonl from the snapshot yields a byte-identical file, and its printed counts equal Release snapshot-2026.11.1's notes: 10,473 pairs, 10,164 short and 309 log-heavy (R1)."
covers = ["R1", "R2"]
after = ["1.13", "1.5"]
hitl = false
risk = "high"
plan_checkpoint = true
notes = ["Likely more than 800 added lines (core derive, jobs.eval, image, chart, kind-up.sh, two workflows): run the independent review on it, including that the oracle fixture is unchanged since its red commit."]

[[entry]]
id = 2
type = "story"
title = "Scores count the whole duplicate cluster, split by ticket kind"
description = "Relevance becomes the query's duplicate cluster, the connected component over every in-subset duplicate_links entry of every issue in both directions, minus the query, per the epic's Hit definition, replacing story 1's target-only relevance everywhere. Results gain Recall@1 and Recall@5 (reported) beside Recall@10 and MRR@10, and p95 retrieval latency, all split short versus log-heavy plus overall (over all queries, not the mean of the kind means), for each mode, with the pair count per kind and each query's first-member rank. A mode whose `available` is false is skipped and named in the results. Ranking is reproducible on unchanged code (BM25 ties at the k-th score resolve the same way every run). The run records its wall-clock cost on kind in the artifact and the job summary, so the full-set decision and the Job's deadline can be set from it and revisited when epic-hybrid-retrieval adds dense. The results JSON keeps story 1's lineage fields; story 3 commits it whole as the baseline and story 4 renders the table from it."
verify = "The cluster metrics match the hand-computed oracle committed before the build for every metric, short, log-heavy and overall, including a case where overall differs from the mean of the kind means, a sibling duplicate counts as a hit and the query never scores itself (R2); registering a fake second mode by replacing ticketscope.core.modes.REGISTRY makes it appear in the results with no change to jobs.eval (R2); two runs on the same corpus give identical metrics (R2, R3); on a PR the artifact holds every metric for keyword split short, log-heavy and overall, the pair counts per kind, each query's first-member rank that an independent recompute matches, and the run's cost (R2)."
covers = ["R2"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "A regressing PR cannot merge"
description = "eval/baseline.json is the full CI results JSON from story 2, committed whole, including its lineage (snapshot version, embedding model id, none for keyword, and preprocessing version). The gate reads the lineage and compares each mode's Recall@10 and MRR@10, per ticket kind, against the baseline within 0.005 absolute, inclusive, and fails on a larger drop unless the same diff changes baseline.json; it finds that diff against the PR's base commit. A changed baseline.json must equal this run's results within the tolerance. A lineage mismatch with no baseline update fails with its reason. A gated mode missing from the run fails unless the baseline is updated; a mode new to the run passes and is reported. Kind floor (spine AD-12): when the run's log-heavy pair count is below 200, the gate fails unless baseline.json carries a kind_floor_decision field with the author's dated reason. A person makes the eval check required in GitHub branch protection."
verify = "A PR that deliberately worsens keyword ranking fails the eval check, and the same PR passes once it updates eval/baseline.json to its own results; a PR changing the preprocessing version without a baseline update fails with a lineage message; unit tests pass a drop of exactly 0.005 and fail 0.0051, fail 199 log-heavy pairs without kind_floor_decision and pass it with one, pass 200 log-heavy pairs without it, fail a changed baseline.json that differs from this run's results, fail a missing gated mode and pass a new mode (R3, R4); GitHub shows the eval check as required on main (R3)."
covers = ["R3"]
after = [2]
hitl = true # a person marks the eval check required in branch protection
risk = "medium"
plan_checkpoint = true

[[entry]]
id = 4
type = "story"
title = "README results table is generated from CI output"
description = "A script renders the README results table (mode by ticket kind: Recall@1, @5, @10, MRR@10, p95, pair counts, snapshot version; numbers to three fixed decimals) from the committed eval/baseline.json, the full CI results JSON story 3 commits, between generated-section markers, and a ci.yml check fails when the README section differs from that render or the markers are missing. The table is committed as-is, whatever it shows; epic-reviewer-package publishes it, and epic-hybrid-retrieval's modes appear in it with no change to the script."
verify = "Running the render script on the committed baseline reproduces the README section exactly; a hand edit to a number in the table fails the ci.yml check; a README with missing generated-section markers fails the check (R4)."
covers = ["R4"]
after = [3]
hitl = false
risk = "low"

[[entry]]
id = 5
type = "story"
title = "Refactor sweep"
description = "Cleanup only, scoped at its start from the plans' deferred items and review findings in this epic: duplicated helpers across jobs.eval, the gate and the render script, and test structure. Behaviour and scores do not change: baseline.json is untouched. Adds a lint rule or test that keeps time.sleep out of tests/ (epic-search-baseline test review G3)."
verify = "On a PR the eval check passes with eval/baseline.json unchanged, ci.yml and its integrated-check pass, import-linter keeps every contract, and tests/ has no time.sleep calls, enforced by a lint rule or a test (R2, R3, R4)."
covers = ["R2", "R3", "R4"]
after = [1, 2, 3, 4]
hitl = false
risk = "low"
