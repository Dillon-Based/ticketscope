# epic-mcp-server stories, in build order. `id` is permanent, never reused.
# Lane: 1 → 2 → 3 → 4 → 5 is one lane, because each edits the mcp server module (ticketscope.mcp).
# 1 is the tracer and owns the shared setup (mcp and apiclient packages, entrypoint, chart keys, route, mcp-e2e.yml).
# 2 is the least certain part and comes next, so any server change Claude Desktop needs lands before 3–5.
# Runs alongside epic-hybrid-retrieval 3.5–3.8: shared files are values.yaml (keys split per the epic's Boundaries)
# and, from story 1, ci.yml's chart-test list (additive lines only; keep both sides on a merge).
# Sizing (epic-search-baseline retro): each story fits one agent session; one likely to add more than
# about 800 lines is flagged in its notes for the independent review.
# Tests: each story writes its own, in tests/mcp/; the closing integrated check is the only test story.
# Re-sliced 2026-11-10 from the epic's test design (test-design-epic-4.md): ids, order and after unchanged;
# descriptions and verify carry the C-1 to C-9 decisions and the risk mitigations (R-nnn ids are the design's).

[[entry]]
id = 1
type = "story"
title = "Tracer: an MCP client calls search_similar_issues through the Gateway on kind"
description = "Lays the thinnest path from an MCP client to the database. Adds the mcp SDK v2 dependency; ticketscope.apiclient, an httpx2 /v1 client built on ticketscope.contract; and ticketscope.mcp, an MCPServer over stateless Streamable HTTP at /mcp with one tool, search_similar_issues(query, mode?, k?), whose structured output is the /v1/search body and whose output schema is generated from the contract. The tool's mode input is a plain string, not the contract's Literal, so an invalid mode reaches the API and story 3 can return its 422 detail. apiclient sends mode exactly as given and never builds the request body through the contract's SearchRequest, whose Literal would reject an unknown mode inside mcp (test design R-005). An omitted mode is omitted on the /v1 call. Its composition root ticketscope.mcp.main reads TICKETSCOPE_* settings (api base URL, allowed hosts) and is the ticketscope-mcp entrypoint in the one app image. import-linter gains contracts that mcp and apiclient never import core, adapters, http, jobs, psycopg or fastembed (settings and telemetry stay cross-cutting), and that nothing imports mcp. The chart gains the mcp keys in values.yaml, an mcp Deployment with probes (its replica count, two on kind, in values-kind.yaml), a Service, and an HTTPRoute for /mcp on the platform Gateway, with transport_security.allowed_hosts from values. The mcp probes check only the mcp process and never call api, so mcp stays Ready when api is down (R-009; story 7's unreachable case relies on this); mcp mounts no database Secret and reaches api only through the in-cluster ticketscope-api Service. scripts/kind-up.sh waits for ticketscope-mcp to be Ready and, on a same-tag image rebuild, restarts it, as it does api (R-011). The new chart render tests are listed in ci.yml's charts job, so they run with the pinned Helm. mcp-e2e.yml runs on PRs through _kind-deploy.yml, behind the same path filter as the other kind jobs, with tests/mcp/** added to .github/kind-paths.yml, and runs an MCP client test from tests/mcp/ against /mcp through the Gateway. Story 2 relies on the route's hostnames and the allowed-hosts value both coming from values, to admit the tunnel's host."
verify = "On a PR, mcp-e2e.yml deploys to kind and its client test lists the tools, calls search_similar_issues for a vague query without a mode (the response's mode equals retrieval.defaultMode read from values.yaml) and with mode=keyword, and validates each structured result against the output schema generated from ticketscope.contract (R1); with mode=keyword the structured result equals the body of a direct POST /v1/search through the Gateway for the same request (R1); a tools/call on a connection that never ran initialize on that replica succeeds (R1); with two mcp replicas, 20 calls on fresh connections all succeed and both pods' logs show tool calls (R1); a request with a host header outside allowed_hosts is refused (R1); unit tests run the server in-process against a fake /v1 with no cluster, and show apiclient sends an unknown mode unchanged and no mode key when mode is omitted (R1); chart render tests show the mcp probes target mcp itself, no database Secret is mounted, the api base URL is the in-cluster Service, and a wildcard or empty allowed_hosts is refused (R1); kind-up.sh returns only after mcp is Ready (R1); the new mcp chart tests are listed in ci.yml's charts job (R1); import-linter keeps every contract and ci.yml passes (R1)."
covers = ["R1"]
after = ["1.6", "1.9"]
hitl = false
risk = "high"
plan_checkpoint = true
notes = ["Likely more than 800 added lines (two packages, entrypoint, chart templates, workflow, tests): run the independent review on it, and name it in the plan; if the plan estimates well over 800 lines, split at the plan checkpoint (packages and unit tests first, then chart, route and workflow) (test design R-004)."]

[[entry]]
id = 2
type = "story"
title = "Claude Desktop answers from ticketscope through a tunnel"
description = "Exposes the kind cluster's /mcp on a fixed public hostname and connects Claude Desktop to it. First checks, and records in the plan, that ngrok's free static domain serves Streamable HTTP responses unaltered to non-browser clients (no interstitial page, no buffering of streamed responses) and that its bandwidth limit covers a demo; if not, it uses Tailscale Funnel. Adds a committed script that starts the tunnel to the kind Gateway, reading the person's tunnel credential from their environment and committing none; the tunnel stops when the script exits. The tunnel's hostname is one environment value, which kind-up.sh passes to both releases (defaulting to the stand-in host), added in three places: the platform Gateway's listener (a second listener for that host, or no listener hostname on kind), the /mcp route's hostnames, and the allowed-hosts value from story 1. The listener matters because the kind listener's hostname ticketscope.kind.internal makes Envoy ignore a route hostname it does not match, so Envoy 404s the tunnel's Host header before the server sees it (test design R-006). CI's kind values set a stand-in tunnel host, so mcp-e2e.yml checks that admission path on every PR without a tunnel; the tunnel host reaches only /mcp. Documents adding the server as a custom connector in Claude Desktop with no auth. During the session it captures Claude Desktop's initialize, tools/list and tools/call requests, with the protocol version and headers and no credentials, and commits them under tests/mcp/; mcp-e2e.yml replays them against /mcp from then on (C-9, R-003). Each tool result carries a text content block with the serialised JSON beside its structured output. Any server change Claude Desktop turns out to need (protocol version, response format) is made here in ticketscope.mcp with a test. A person creates the tunnel account, reserves the hostname, runs the script and the Claude Desktop session."
verify = "A person runs the tunnel script against kind, adds the hostname's /mcp as a custom connector in Claude Desktop, asks a triage question, and Claude calls search_similar_issues and answers citing returned issues; a screenshot of that session is committed and linked from the plan (R4); the plan records which tunnel was chosen and why (R4); in mcp-e2e.yml, a tools/list with the stand-in tunnel host reaches /mcp, the same host gets 404 for /v1/search and /, and ticketscope.kind.internal still works (R4); the captured Claude Desktop requests are committed with no credential and their replay passes in mcp-e2e.yml (R4); after the script exits, the tunnel hostname no longer reaches the cluster (R4); mcp-e2e.yml still passes (R1)."
covers = ["R4"]
after = [1]
hitl = true # a person creates the tunnel account, runs the tunnel and the Claude Desktop session
risk = "high"
plan_checkpoint = true
notes = ["Before connecting Claude Desktop, curl the tunnel's /mcp from outside with a non-browser client and confirm there is no interstitial page and a streamed response arrives intact.", "Later stories do not edit the captured Claude Desktop requests; a pin test guards their bytes, and any change to them is a review finding (test design, Independent Oracles).", "The listener change edits the platform chart (epic-search-baseline's): its kind values, and its Gateway template if a second listener is chosen; keep ticketscope.kind.internal working and the tunnel value empty by default, so nothing extra renders when it is unset."]

[[entry]]
id = 3
type = "story"
title = "Tool errors carry the API's problem detail"
description = "Makes every failed tool call an MCP tool error rather than a protocol failure or an empty result. apiclient turns a /v1 RFC 9457 problem+json response into a typed error carrying its detail; the tool returns is_error with that detail, and an invalid mode is rejected with the API's 422 detail rather than by a separate list in mcp. A connection failure or timeout becomes 'ticketscope API unreachable: connection refused' or 'ticketscope API unreachable: timed out after <n>s', with no stack trace; the timeout is TICKETSCOPE_API_TIMEOUT_SECONDS, chart default 10 (C-5); story 7's unreachable case relies on this timeout. An error response that is not problem+json (an HTML 502, a truncated body, a 200 that fails the contract) becomes is_error naming the HTTP status and a generic reason, never the response body (C-6). Story 4's get_issue and story 5's spans build on this error path."
verify = "The CI client test on kind calls search_similar_issues with an unknown mode and gets is_error whose text equals the API's 422 detail (R3); unit tests against a fake /v1 serving problem bodies recorded from the real app factory cover a 422, a 404, a 500, a 503, a refused connection, a timeout, an HTML 502 and a 200 that fails the contract, each returning is_error with the detail and never a JSON-RPC error (R3); k=0, k=51 and a non-integer k each return is_error, never a JSON-RPC error (R3); mcp-e2e.yml passes, including the Claude Desktop replay (R1, R3)."
covers = ["R3"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "get_issue takes the issue key"
description = "Adds the readable key to /v1 additively and the get_issue tool on it. The contract's Issue gains key: str | None = None (for example MCL-6629; optional and nullable, so an older body still validates, C-8), read from the issue's url by one function that reuses core.derive.MOJANG_BROWSE_URL and gives null when the url is not a browse URL (as in v1-shaped test fixtures), so every /v1 response carries it with no new column, no reload and no preprocessing change. api adds GET /v1/issues/by-key/{key}, backed by a lookup on the CorpusStore port, its in-memory fake and the Postgres adapter (an exact match on url, passed as a bound SQL parameter), which returns the GET /v1/issues/{number} body. A key must match ^[A-Z][A-Z0-9]*-[1-9][0-9]*$ exactly, with no case or whitespace normalisation; a key that does not match, or matches no issue, gets a problem+json 404 (C-4). apiclient percent-encodes the key as one path segment: httpx2 otherwise resolves /v1/issues/by-key/../6629 to GET /v1/issues/6629, silently a different issue (test design R-007). The tool get_issue(key) returns that body as structured output with an output schema generated from the contract, returns a tool error when the returned issue.key differs from the requested key, and an unknown key comes back as a tool error through story 3's error path. scripts/v1_parity.py gains an option that drops exactly issue.key before comparing. GET /v1/issues/{number} is unchanged apart from the added key, and the page is not touched."
verify = "The CI client test takes the key of a search_similar_issues result, calls get_issue with it, and gets back the issue with that key and its outcome, validated against the generated schema (R2); get_issue with an unknown key returns is_error with the API's detail (R3); unit tests show the hostile keys 6629, ../6629, MCL-6629/.., mcl-6629, ' MCL-6629 ', MCL-6629?x=1 and an SQL-shaped key each return is_error and never another issue, and a fake /v1 answering with a different key gives is_error (R2, R3); for every v2 fixture issue the url-derived key equals the snapshot's key (R2); on a Postgres container the by-key lookup runs as ticketscope_ro, returns nothing for the SQL-shaped key, and agrees with the in-memory fake (R2); POST /v1/search results carry key, and existing /v1 tests pass, and the v1 parity script passes when it compares bodies with issue.key dropped and fails on any other difference (R2); the eval check passes with eval/baseline.json unchanged (R2); mcp-e2e.yml passes, including the Claude Desktop replay (R1, R2)."
covers = ["R2", "R3"]
after = [3]
hitl = false
risk = "medium"
plan_checkpoint = true
notes = ["A red-mode /bmad-tea-automate session commits the key oracle and hostile-key fixtures (test-design-epic-4.md, Independent Oracles) before this story's build; the build does not author them. The plan checkpoint stops the story if those fixtures are not committed.", "Touches contract, route, port, fake, Postgres adapter, apiclient, tool, parity script and tests: if the plan estimates more than about 800 added lines, run the independent review on it."]

[[entry]]
id = 5
type = "story"
title = "One MCP tool call yields one trace in Tempo"
description = "Wires ticketscope-mcp into the AD-10 span tree. The mcp process sets up telemetry with service.name ticketscope-mcp and exports OTLP to the in-cluster collector from values. Each tool call is a SERVER span tools/call {tool} with mcp.method.name, gen_ai.operation.name=execute_tool and gen_ai.tool.name, status ERROR on story 3's tool errors, and query text only when the existing opt-in value is set; those attribute names live in one constants list that cites the semconv version (R-010). apiclient's httpx2 calls are instrumented, so the CLIENT span carries traceparent to api, whose spans continue the trace: the story first tries opentelemetry-instrumentation-httpx on an httpx2 client, and if no CLIENT span or traceparent header appears, apiclient opens the CLIENT span itself with the HTTP semconv attributes and injects traceparent in an httpx2 event hook (C-1). When the MCP request's _meta carries a traceparent, the tool span continues that trace; an HTTP traceparent header on the /mcp POST is ignored (C-3). The check finds a trace that has no caller context by a TraceQL search, {resource.service.name=\"ticketscope-mcp\" && name=\"tools/call search_similar_issues\"}, within the call's start and end time, with the check's calls made one at a time (C-2). The Tempo lookup the check needs lives in tests/mcp/ and does not touch tests/smoke/, which epic-hybrid-retrieval's 3.8 extends; unifying it with tests/smoke's private helpers is left for a later sweep."
verify = "The CI check on kind calls search_similar_issues with mode=hybrid, then finds in Tempo one trace whose root is the ticketscope-mcp tools/call span, with the CLIENT POST, api's POST /v1/search, retrieval {mode}, embeddings {model} and the db query beneath it (R5); a call carrying a traceparent in _meta lands in that trace id, and a call carrying both a header and _meta with different ids lands in the _meta one (R5); a tool error's span has status ERROR (R5); get_issue yields its own trace the same way (R5); no span carries query text by default, and the tool span's attribute keys equal the constants list (R5); a unit test captures traceparent on apiclient's outgoing request with the tool span's trace id (R5); mcp-e2e.yml passes, including the Claude Desktop replay (R1, R5)."
covers = ["R5"]
after = [4]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Refactor sweep"
description = "Cleanup only, scoped at its start from this epic's plans, review findings, and relevant entries in _bmad-output/initiative-ticketscope/deferred-work.md and _bmad-output/deferred-work.md. Candidate areas are duplication between the two tools and apiclient, chart template repetition between api and mcp, and test structure in tests/mcp/. The plan links each considered finding to an include, defer, or reject decision with a reason; behaviour-changing work stays in linked follow-ups. It records whether tests/mcp's Tempo lookup is unified with tests/smoke's helpers: unification identifies the shared owner and both consumers; deferral records a reason and follow-up reference (R-008). Behaviour, the /v1 contract and the span tree do not change."
verify = "On a PR, mcp-e2e.yml (with the Claude Desktop replay) and ci.yml pass, and import-linter keeps every contract (R1, R2, R3, R5). The eval job passes when the PR matches the eval filter in .github/kind-paths.yml; otherwise its filtered skip is acceptable and the plan records why. In either case, eval/baseline.json is byte-identical to the PR base revision. If chart templates are refactored, before/after rendered api and mcp resources agree for default, kind, and tunnel-host values. If Tempo helpers are unified, focused tests preserve hex/base64 ids, string intValue parsing, MCP's since_ns cutoff, and its search limit of 200; both MCP and smoke suites pass. Any new shared helper directory is included in the kind path filter so subsequent helper-only changes run both suites."
covers = []
after = [1, 2, 3, 4, 5]
hitl = false
risk = "low"
notes = ["Preserve the captured Claude Desktop request bytes and their independent pin test, as required by story 4.2."]

[[entry]]
id = 7
type = "story"
title = "Integrated check on kind"
description = "Extends mcp-e2e.yml's suite in tests/mcp/ to prove the epic end to end on a fresh kind cluster: both tools with and without a mode, get_issue by a key taken from a search, each tool-error case including an unreachable API, the Claude Desktop replay, and one trace from the tool call to the database in Tempo. The unreachable case scales api to zero in its own pytest invocation after the main suite, never by test order, and a finalizer scales api back and waits for it to be Ready (R-009). It relies on story 1's mcp-only probes and story 3's TICKETSCOPE_API_TIMEOUT_SECONDS. Claude Desktop through the tunnel (R4) is evidenced by story 2's recorded session and the replay, not re-run in CI; the epic's closure adds one repeated session by a person (epic Done when)."
verify = "On a fresh kind cluster, mcp-e2e.yml's integrated suite passes in CI covering each Done when line of the epic that CI can run (R1, R2, R3, R5), including the Claude Desktop replay (R4); with api at zero, mcp stays Ready and the tool returns is_error with the unreachable detail within the timeout plus a margin, not a Gateway 503, and api is restored afterwards (R3); the epic's Notes link story 2's recorded Claude Desktop session for R4 and cite this story's mcp-e2e.yml run URL as the CI evidence (C-7)."
covers = ["R1", "R2", "R3", "R4", "R5"]
after = [6]
hitl = false
risk = "medium"
