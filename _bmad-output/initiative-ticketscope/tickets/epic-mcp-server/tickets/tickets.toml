[[entry]]
id = 7
type = "story"
title = "Integrated check on kind"
description = "Extends mcp-e2e.yml's suite in tests/mcp/ to prove the epic end to end on a fresh kind cluster: both tools with and without a mode, get_issue by a key taken from a search, each tool-error case including an unreachable API (made by scaling api to zero as the suite's last step), and one trace from the tool call to the database in Tempo. Claude Desktop through the tunnel (R4) is evidenced by story 2's recorded session, not re-run in CI."
