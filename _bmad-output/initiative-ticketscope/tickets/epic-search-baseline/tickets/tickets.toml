# epic-search-baseline stories, in build order. `id` is permanent, never reused.
# Lanes (stories touching the same code wait on each other):
#   data:     2 corpus terms -> 3 ingest -> 5 load; 4 derive -> 3 ingest, 4 -> 5;
#             12 Jira corpus spike (decided: switch to Mojang Jira) -> 14 Jira derive -> 13 Jira ingest -> 5;
#             4 -> 14, 3 -> 13 (reused pipeline)
#   api:      6 /v1 completion -> 7 page -> 9 trace
#   platform: 8 backups -> 9 trace; 5 load -> 9 trace (jobs telemetry)
# Shared setup is owned by story 1 (the tracer); every later story builds on it.

[[entry]]
id = 1
type = "story"
title = "Tracer: keyword search answers through the Gateway on kind"
description = "Lays the repo and the thinnest path through every layer. The uv repo follows the spine's layout. ci.yml runs ruff, pyright, pytest and import-linter with the AD-1 layer contracts. ticketscope.contract holds the /v1 search models. core holds the Retriever port, REGISTRY with the keyword mode, and the in-memory CorpusStore fake. The Postgres adapter ranks with pg_textsearch BM25 and negates its scores. The Postgres image is CNPG standard PG18 with pgvector plus pg_textsearch, preloaded through shared_preload_libraries (AD-9). Migration 0001 creates both extensions, the issue table with kind and outcome columns, the corpus_meta table, and the ticketscope_ro default grants. The snapshot JSON Schema v1, carrying every AD-6 field, is committed with a small synthetic fixture snapshot, no real issue text, holding short and log-heavy issues. The fixture ships in the app image under snapshot version 'fixture', pinned in values, so story 5 swaps in a real version by changing the pin. load loads the pinned snapshot and writes the corpus_meta row, which api reads for corpus_version. Both images are tagged with the git SHA; _kind-deploy builds for the runner's architecture, and ci.yml builds amd64 and arm64 when images/ changes (AD-16). scripts/kind-up.sh and _kind-deploy.yml are in place. The platform release holds Gateway API CRDs, Envoy Gateway with cloud-provider-kind and the CNPG operator. The ticketscope release holds a two-instance Cluster, the migrate and load hooks in AD-22 order, api and its HTTPRoute; values.yaml holds defaults and values-kind.yaml only environment facts (AD-25). The fixture records each issue's expected kind outside the schema, and load stores it; outcomes read 'unknown'; story 5 replaces both with derived values. Proves a GitHub-hosted runner fits kind (epic Assumption). Later stories build on everything here."
verify = "On a PR, CI passes ci.yml, and _kind-deploy brings up both releases on kind; POST /v1/search with mode keyword through the Gateway returns ranked fixture issues in the /v1 shape, and a deliberate core-imports-adapter change fails import-linter."
covers = ["R3", "R5", "R7"]
after = []
hitl = true # a person creates the public GitHub repo, enables Actions, and runs kind-up.sh locally once
risk = "high"
plan_checkpoint = true

[[entry]]
id = 2
type = "spike"
title = "Settle the corpus terms"
description = "A person decides whether closed kubernetes/kubernetes issue text may be stored and republished as a public GitHub Release asset and demo index, and on what conditions (attribution, excluded fields, author handles). The answer is recorded as a dated Decision line in the epic's Notes; story 3's publish waits on it. Spine open question 'Corpus terms'."
verify = "The epic's Notes hold a dated Decision line that says yes, yes with named conditions, or no, and story 3's entry reflects any conditions."
covers = ["R1"]
after = []
hitl = true
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Ingest publishes a versioned corpus snapshot"
description = "jobs.ingest, the only GitHub API caller, fetches closed kubernetes/kubernetes issues (no PRs) from about the last three years, capped at 20,000, with labels, comments (author_association, body, created_at) and timeline events including marked_as_duplicate and cross-referenced or closing PRs with each PR's merged state. It writes compressed JSONL that validates against story 1's schema, applying story 2's corpus terms (issue link per record, no author logins, masked emails and secrets, a committed exclusion list), and reports the kind split using story 4's function. snapshot.yml, on dispatch, publishes it as a never-overwritten YYYY.MM.N GitHub Release asset with a SHA-256 checksum. Before publishing it times a load through story 1's load path on the runner, and the window is tuned so that load finishes within 10 minutes of the 30-minute spin-up (initiative R10). Ingest reads with a token stored as a repo secret and resumes after a rate limit or job timeout. Story 5 loads this snapshot, and epic-eval-gate derives its pairs from it."
verify = "A dispatched snapshot.yml run publishes a YYYY.MM.N Release asset and checksum that validate against the committed schema and hold both short and log-heavy issues; its Release notes state the window, the issue count, the kind split and a measured load time within 10 minutes; a second dispatch publishes YYYY.MM.N+1 and leaves the first unchanged; no author login appears in the asset, the Release notes and README carry attribution and takedown text, and recorded-response tests show planted emails and secrets masked and an excluded issue absent."
covers = ["R1"]
after = [1, 2, 4]
hitl = true # a person stores a read-only GitHub token as a repo secret and dispatches the first publish
risk = "high"
plan_checkpoint = true

[[entry]]
id = 12
type = "spike"
title = "Choose the Jira corpus"
description = "Can The Public Jira Dataset v7 (Zenodo 15719919, CC BY 4.0, a MongoDB dump of 16 public Jira instances, 2.7M issues) replace Kubernetes issues as the corpus, and if so which subset of about 20-50k issues? The first Kubernetes snapshot (run 42261907819, 5,907 issues) has 21 duplicates and none with a target, too little ground truth for epic-eval-gate. Measures per instance and project: in-subset duplicate pairs by kind, resolution-to-outcome coverage, issue-type mix and fit, text hygiene, timed load, terms. Story 5 and epic-eval-gate wait on the answer; a switch replans the data lane. See the spike file."
verify = "A findings note beside the spike compares instances and leading projects on the decision rule, names a subset with its duplicate pairs by kind and a load time within 600 s, and the epic's Notes hold a dated Decision line by the author: switch, stay, or switch with conditions."
covers = ["R1"]
after = []
hitl = true # a person downloads the dataset, reads the sampled issues and decides
risk = "high"

[[entry]]
id = 4
type = "story"
title = "Derive kind and outcome in core"
description = "Two pure core functions over a snapshot issue (AD-8). Outcome applies the epic's precedence: duplicate, fixed, not_planned, stale, answered, unknown, with summary, source and ref per the /v1 outcome shape and the epic's outcome rules. Kind counts fenced blocks and log-like lines against a threshold parameter that story 5 sets from real data. Unit tests cover every precedence branch and both kinds on synthetic issues. Story 3 reports the kind split with it; story 5 calls both at load."
verify = "pytest shows one passing case per outcome branch, including precedence ties such as a duplicate that was also closed by a PR, and kind cases on either side of the threshold."
covers = ["R2"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 14
type = "story"
title = "Derive Jira outcome and kind in core"
description = "Extends story 4's pure core functions for the Mojang corpus (AD-8), beside the GitHub rules, which stay for the fixture. Outcome maps the issue's Jira resolution per spike 12's outcome-mapping.md onto duplicate, fixed, not_planned, stale, answered or unknown, with summary, source and ref per the /v1 outcome shape; a Question or Support type issue resolved after a comment by someone other than the reporter is answered, read from a non-reporter-comment flag so no identity is needed. Kind treats Jira {code...} and {noformat} toggles as fenced blocks before counting. It adds the schema-v2 fields its rules read (resolution, issue type, the non-reporter-comment flag, the readable key) to core's snapshot model, which story 13's committed JSON Schema v2 then mirrors. The derivation version changes, so a load reloads. Its /v1 source is label for duplicate, closing_comment for answered and null otherwise, so the /v1 contract and the migration do not change (epic Jira outcome). Unit tests cover every mapped resolution class, an unmapped resolution, the answered rule on both sides, and Jira blocks on either side of the threshold, on synthetic Jira-shaped issues. Story 13 reports the kind split with it; story 5 calls it at load."
verify = "pytest shows one passing case per outcome class from a Jira resolution, an unmapped resolution reading unknown, an answered case and a not-answered case, and kind cases with {code} and {noformat} blocks on either side of the threshold; the derivation version differs from story 4's."
covers = ["R2"]
after = [4, 12]
hitl = false
risk = "medium"

[[entry]]
id = 13
type = "story"
title = "Ingest publishes the Jira snapshot (schema v2)"
description = "jobs.ingest builds the corpus snapshot from The Public Jira Dataset v7 instead of the GitHub API, run locally by a person against a restored dump, since the dump does not fit a GitHub-hosted runner (epic Decision): the resolved issues of Mojang MCL, REALMS and MCD plus the unresolved issues their duplicates point to (epic Corpus scope), deduplicating repeated issue keys, first document wins. Schema v2, committed as epic-eval-gate's contract, carries each issue's Jira id and readable key, its bugs.mojang.com URL, resolution, issue type, the duplicate link to its target, comments without author ids, and a derived non-reporter-comment flag; the fixture moves to v2, and jobs.load reads v2 (story 1's load path, which the timed load runs) from here on. Before its plan, bmad-architecture amends the spine for the Jira corpus (AD-6 fields, AD-10 data-source id, Identifiers, Provenance). Its JSON Schema v2 mirrors the snapshot model story 14 extends. It reuses story 3's pipeline: the masking (plus [~user] mentions), the exclusion list, YYYY.MM.N versioning, the SHA-256 checksum, the never-overwritten GitHub Release with the takedown path, and the timed load within 10 minutes. The Release notes and README carry spike 12's attribution line. It reports the issue count, the in-subset duplicate pairs by kind and the kind split, using story 14's rules. Spike 12's convert.py is evidence of the mapping, not code to copy. Story 5 loads this snapshot, and epic-eval-gate derives its pairs from it."
verify = "A person-run ingest from the restored dataset publishes a YYYY.MM.N Release asset and checksum that validate against the committed schema v2 and hold both short and log-heavy issues; its Release notes state the subset, the issue count, the in-subset duplicate pairs by kind, the kind split and a measured load time within 10 minutes, and carry the attribution line; no reporter, assignee or author id appears in the asset; tests on a recorded slice of the dataset show masked emails, secrets and mentions, an excluded issue absent, and a repeated key kept once."
covers = ["R1"]
after = [3, 14]
hitl = true # a person restores the dataset dump locally, runs ingest and the publish from their machine, and checks the Release
risk = "high"
plan_checkpoint = true

[[entry]]
id = 5
type = "story"
title = "Load the pinned snapshot with kind and outcome"
description = "jobs.load, the only writer, downloads the snapshot version pinned in values, with its checksum pinned beside it, refuses an asset whose checksum differs, stores each issue with kind and outcome from story 14's Jira rules, and writes the corpus_meta row with the pinned snapshot version (AD-21). The preprocessing version includes core's derivation version, so a kind-threshold or outcome-rule change reloads; an unchanged snapshot, model and preprocessing version is a no-op. A reload swaps the corpus in one transaction, so api never sees a partial corpus. It sets the kind threshold from story 13's Jira snapshot, showing 20 sampled issues from each side in the PR, and logs the share of each kind and each outcome and the load time against the 10-minute budget. It commits a golden-query file with one vague and one log-heavy query from the real snapshot and the issue each should return, approved at the plan review. It replaces story 1's stored fixture kinds with computed ones, and a unit test shows the computed kind equals each fixture issue's expected kind. CI on kind loads the pinned real snapshot by changing story 1's pin; unit tests keep the fixture. Story 13 already makes load read schema v2; this story adds the derived kind and outcome."
verify = "On kind in CI the load hook loads the pinned snapshot; a SQL check finds no issue without a kind or an outcome, the job log reports each kind's and each outcome's share and a load time within 10 minutes, a helm upgrade with the same pin logs a no-op, and a changed derivation version reloads; a unit test shows a wrong checksum is refused and the old corpus stays."
covers = ["R2"]
after = [12, 13, 14]
hitl = false
risk = "medium"
plan_checkpoint = true

[[entry]]
id = 6
type = "story"
title = "Complete the /v1 contract"
description = "Adds the rest of AD-4 to story 1's path: GET /v1/issues/{number} with body and outcome, k bounds 1..50, 422 for an unknown mode, RFC 9457 problem+json errors, and exclude and available(store) on the Retriever port (AD-19), which epic-eval-gate uses to skip modes and drop the query issue. Contract models allow unknown fields (AD-20). Log-heavy input is accepted: a query containing full-text operator characters (& | ! : ( ) or a multi-KB pasted log returns 200 with ranked results. Epic-mcp-server calls GET /v1/issues. Story 7 builds on this http module next."
verify = "Contract tests against the in-memory fake and one run on kind show GET /v1/issues/{number} returns issue and outcome, k=0, k=51 and an unknown mode return problem+json 422, an excluded issue never appears in results, and a query with operator characters returns 200."
covers = ["R3"]
after = [1]
hitl = false
risk = "low"

