[[entry]]
id = 11
type = "story"
title = "Integrated check on kind"
description = "One CI job on kind, run on every PR through _kind-deploy, checks the epic's Done when together on the pinned real snapshot: the loaded snapshot matches the committed schema and left no issue without a kind or an outcome (stories 3, 5); each query in story 5's golden-query file returns its expected issue in the top-k with outcomes through /v1 and the page, with a recorded known keyword miss reported but not gated (5, 6, 7); one trace reaches Tempo (9); and a backup completes (8)."
verify = "The integrated-check job passes on a PR and fails when any one of its five checks is broken on purpose."
covers = ["R1", "R2", "R3", "R4", "R5", "R6", "R7"]
after = [10]
hitl = false
risk = "medium"
