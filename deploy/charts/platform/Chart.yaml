apiVersion: v2
name: platform
description: >-
  ticketscope platform release (AD-13): Gateway API CRDs and the one Gateway,
  Envoy Gateway as the GatewayClass implementation on kind, and the CNPG operator.
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  # Brings the Gateway API CRDs (in its crds subchart's crds/ directory).
  - name: gateway-helm
    alias: envoy-gateway
    version: v1.9.3
    repository: oci://docker.io/envoyproxy
    condition: envoy-gateway.enabled
  - name: cloudnative-pg
    alias: cnpg
    version: 0.29.1
    repository: https://cloudnative-pg.github.io/charts
    condition: cnpg.enabled
