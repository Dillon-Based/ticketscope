{{- if .Values.gateway.createClass }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gateway.className }}
  labels:
    app.kubernetes.io/part-of: ticketscope
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  controllerName: {{ .Values.gateway.controllerName }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: ticketscope
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.port }}
      {{- with .Values.gateway.hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      allowedRoutes:
        namespaces:
          from: All
    {{- with .Values.gateway.tunnelHostname }}
    # The tunnel's public hostname: only routes naming it attach here (the /mcp route).
    - name: tunnel
      protocol: HTTP
      port: {{ $.Values.gateway.port }}
      hostname: {{ . | quote }}
      allowedRoutes:
        namespaces:
          from: All
    {{- end }}
