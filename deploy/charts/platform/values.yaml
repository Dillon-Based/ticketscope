# Defaults for the platform release. Environment facts live in values-<env>.yaml.

gateway:
  # The one Gateway (AD-14). Routes from the ticketscope release attach to it.
  name: ticketscope
  # Public hostname; set per environment.
  hostname: ""
  className: envoy
  # The GatewayClass this release creates, when createClass is true.
  createClass: true
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  port: 80

envoy-gateway:
  enabled: true

cnpg:
  enabled: true
  crds:
    create: true
