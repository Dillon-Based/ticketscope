{{- if .Values.backup.restoreFrom -}}
{{- if not .Values.backup.enabled -}}{{- fail "backup.restoreFrom needs backup.enabled" -}}{{- end -}}
{{- if not .Values.backup.serverName -}}{{- fail "backup.restoreFrom needs its own backup.serverName" -}}{{- end -}}
{{- if eq .Values.backup.restoreFrom .Values.backup.serverName -}}{{- fail "backup.restoreFrom must differ from backup.serverName (an incarnation never archives into the folder it restores from)" -}}{{- end -}}
{{- end -}}
{{- /*
The ticketscope_ro password: generated once, then kept across upgrades (AD-7).
*/ -}}
{{- $secretName := include "ticketscope.roSecret" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "password") -}}
{{- $password = index $existing.data "password" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticketscope.labels" . | nindent 4 }}
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: ticketscope_ro
  password: {{ $password | quote }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "ticketscope.dbCluster" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticketscope.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.database.instances }}
  imageName: {{ include "ticketscope.postgresImage" . }}
  imagePullPolicy: {{ .Values.image.pullPolicy }}
  postgresql:
    shared_preload_libraries:
      - pg_textsearch
  {{- if .Values.backup.restoreFrom }}
  # R11: a recreated environment recovers from the previous incarnation's folder under the
  # same ObjectStore, then archives under its own serverName (never the one it reads). The
  # database already holds the corpus, so the load Job is not rendered (jobs.yaml).
  bootstrap:
    recovery:
      source: previous-incarnation
      database: app
      owner: app
  externalClusters:
    - name: previous-incarnation
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: {{ .Values.backup.objectStoreName }}
          serverName: {{ .Values.backup.restoreFrom | quote }}
  {{- else }}
  bootstrap:
    initdb:
      database: app
      owner: app
      # Neither vector nor pg_textsearch is a trusted extension, so the app owner
      # cannot create them; create them here as superuser. Migration 0001 keeps
      # CREATE EXTENSION IF NOT EXISTS.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
        - CREATE EXTENSION IF NOT EXISTS pg_textsearch
  {{- end }}
  managed:
    roles:
      - name: ticketscope_ro
        ensure: present
        login: true
        comment: read-only role for api and eval (AD-7)
        passwordSecret:
          name: {{ $secretName }}
  {{- with .Values.database.serviceAccount.annotations }}
  # EKS: the IRSA role annotation (AD-25). No service account is named here, so the
  # operator creates the one named after the Cluster and applies this template.
  serviceAccountTemplate:
    metadata:
      annotations:
        {{- toYaml . | nindent 8 }}
  {{- end }}
  {{- if .Values.backup.enabled }}
  # WAL archiving through the Barman Cloud Plugin (AD-18): a plugin Backup
  # completes only once its end WAL is archived.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ .Values.backup.objectStoreName }}
        {{- with .Values.backup.serverName }}
        serverName: {{ . | quote }}
        {{- end }}
  {{- end }}
  storage:
    size: {{ .Values.database.storage.size }}
    {{- with .Values.database.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  resources:
    {{- toYaml .Values.database.resources | nindent 4 }}
