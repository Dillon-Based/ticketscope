{{- /*
AD-22 order: migrate is a post-install/pre-upgrade hook; load is a
post-install/post-upgrade hook with a later weight, so on install migrate
finishes first. eval (only when eval.enabled) is a post-install/post-upgrade hook
weighted after load, so it scores the corpus load just wrote. before-hook-creation
avoids Job-immutability failures on upgrade.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: ticketscope-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticketscope.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ add .Values.jobs.dbWaitTimeoutSeconds 300 }}
  template:
    metadata:
      labels:
        {{- include "ticketscope.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "ticketscope.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["ticketscope-migrate"]
          env:
            {{- include "ticketscope.ownerDbEnv" . | nindent 12 }}
            {{- include "ticketscope.otlpEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.jobs.resources | nindent 12 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ticketscope-load
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticketscope.labels" . | nindent 4 }}
    app.kubernetes.io/component: load
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  # Computing embeddings on CPU takes far longer than copying the snapshot or the asset.
  activeDeadlineSeconds: {{ ternary 3000 900 (not (empty (include "ticketscope.embeddingsCompute" .))) }}
  template:
    metadata:
      labels:
        {{- include "ticketscope.labels" . | nindent 8 }}
        app.kubernetes.io/component: load
    spec:
      restartPolicy: Never
      containers:
        - name: load
          image: {{ include "ticketscope.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["ticketscope-load"]
          env:
            {{- include "ticketscope.ownerDbEnv" . | nindent 12 }}
            {{- include "ticketscope.otlpEnv" . | nindent 12 }}
            - name: TICKETSCOPE_SNAPSHOT_VERSION
              value: {{ required "snapshot.version is required" .Values.snapshot.version | quote }}
            - name: TICKETSCOPE_SNAPSHOT_SHA256
              value: {{ required "snapshot.sha256 is required (the pinned checksum)" .Values.snapshot.sha256 | quote }}
            - name: TICKETSCOPE_SNAPSHOT_BASE_URL
              value: {{ .Values.snapshot.baseUrl | quote }}
            # The image user (10001) cannot write /app; the asset is fetched here.
            - name: TICKETSCOPE_SNAPSHOT_DIR
              value: /snapshots
            {{- with include "ticketscope.embeddingEnv" . }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- if .Values.embeddings.assetVersion }}
            # The pinned embedding asset (AD-6, AD-25): load downloads it from the same
            # base URL as the snapshot, verifies it and bulk-loads it. Nothing is computed.
            - name: TICKETSCOPE_EMBEDDINGS_ASSET_VERSION
              value: {{ .Values.embeddings.assetVersion | quote }}
            - name: TICKETSCOPE_EMBEDDINGS_SHA256
              value: {{ required "embeddings.sha256 is required when embeddings.assetVersion is set (the pinned checksum)" .Values.embeddings.sha256 | quote }}
            {{- else if .Values.embeddings.computeOnKind }}
            - name: TICKETSCOPE_EMBEDDINGS_COMPUTE
              value: "true"
            {{- end }}
          volumeMounts:
            - name: snapshots
              mountPath: /snapshots
          resources:
            {{- if include "ticketscope.embeddingsCompute" . }}
            {{- $res := deepCopy .Values.jobs.resources }}
            {{- $_ := set $res.limits "memory" .Values.embeddings.loadMemoryLimit }}
            {{- toYaml $res | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.jobs.resources | nindent 12 }}
            {{- end }}
      volumes:
        - name: snapshots
          emptyDir: {}
{{- if .Values.eval.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ticketscope-eval
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticketscope.labels" . | nindent 4 }}
    app.kubernetes.io/component: eval
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  # Deterministic: a retry would only repeat a failure and double the run time.
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.eval.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "ticketscope.labels" . | nindent 8 }}
        app.kubernetes.io/component: eval
    spec:
      restartPolicy: Never
      containers:
        - name: eval
          image: {{ include "ticketscope.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["ticketscope-eval"]
          env:
            # eval reads as ticketscope_ro (AD-7).
            - name: TICKETSCOPE_DB_HOST
              value: {{ include "ticketscope.dbCluster" . }}-rw
            - name: TICKETSCOPE_DB_NAME
              value: app
            - name: TICKETSCOPE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "ticketscope.roSecret" . }}
                  key: username
            - name: TICKETSCOPE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ticketscope.roSecret" . }}
                  key: password
            {{- include "ticketscope.otlpEnv" . | nindent 12 }}
            {{- with include "ticketscope.embeddingEnv" . }}
            {{- . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.eval.resources | nindent 12 }}
{{- end }}
