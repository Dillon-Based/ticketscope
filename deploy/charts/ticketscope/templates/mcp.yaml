{{- $hosts := include "ticketscope.mcpHosts" . | fromJsonArray }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketscope-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticketscope.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        {{- include "ticketscope.labels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
    spec:
      containers:
        - name: mcp
          image: {{ include "ticketscope.appImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["ticketscope-mcp"]
          ports:
            - name: http
              containerPort: 8080
          env:
            # mcp reaches api over /v1 only: no database Secret, no default mode (AD-25).
            - name: TICKETSCOPE_API_BASE_URL
              value: {{ printf "http://ticketscope-api.%s.svc" .Release.Namespace | quote }}
            - name: TICKETSCOPE_API_TIMEOUT_SECONDS
              value: {{ .Values.mcp.apiTimeoutSeconds | quote }}
            - name: TICKETSCOPE_MCP_ALLOWED_HOSTS
              value: {{ join "," $hosts | quote }}
            {{- include "ticketscope.otlpEnv" . | nindent 12 }}
            - name: TICKETSCOPE_TRACE_QUERY_TEXT
              value: {{ .Values.telemetry.recordQueryText | quote }}
          # Probes check the process only, never api (R-009).
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ticketscope-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticketscope.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ticketscope-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ticketscope.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    {{- range $hosts }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: ticketscope-mcp
          port: 80
