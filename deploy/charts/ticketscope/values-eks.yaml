# EKS: environment facts only (AD-25): storage class, replica counts and the backup switch.
# The hostname and the ECR image repositories carry the domain or the account id, so
# scripts/eks-deploy.sh sets them (hostname, image.app.repository, image.postgres.repository).
# Auth is off: no auth key exists until epic 6.
api:
  replicas: 1

mcp:
  replicas: 1

database:
  # Two instances on two nodes: the failure drill loses a node (R10).
  instancePlacement: required
  storage:
    storageClass: gp3

# Backups use the Cluster's IRSA role, no keys (R6). scripts/eks-deploy.sh sets what carries an
# account id or an incarnation: backup.destinationPath, backup.serverName and
# database.serviceAccount.annotations (the role ARN).
backup:
  enabled: true
  credentials:
    inheritFromIAMRole: true
  scheduled:
    enabled: true
