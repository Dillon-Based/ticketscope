# Defaults for the ticketscope release (AD-25). Environment facts live in
# values-<env>.yaml; image tags (the git SHA, AD-16) are set at install time.

image:
  app:
    repository: ticketscope-app
    tag: ""
  postgres:
    repository: ticketscope-postgres
    tag: ""
  pullPolicy: IfNotPresent

# Public hostname on the Gateway listener and the routes; set per environment.
hostname: ""

# The platform release's Gateway that the routes attach to (AD-14).
gateway:
  name: ticketscope
  namespace: platform

retrieval:
  # Server default when a request omits `mode` (AD-4, AD-25): the mode with the best overall
  # MRR@10 in eval/baseline.json, hybrid on a tie. Chosen by that number (story 3.6):
  # hybrid 0.5936, dense 0.5787, keyword 0.5505. Re-pick it when the baseline changes
  # which mode leads. mcp has no default of its own and sends none (AD-25).
  defaultMode: hybrid

# The pinned snapshot that load reads (AD-6): a `snapshot-<version>` Release asset and
# its SHA-256. Set here only; environment files never override it (AD-25).
snapshot:
  version: "2026.11.1"
  sha256: "e7940ba12db44b9ac909e2634d537e30406448f45a9d780fd96fa7e6ec211b2f"
  baseUrl: "https://github.com/Dillon-Based/ticketscope/releases/download"

# Traces (AD-10, AD-11): OTLP/HTTP to the platform release's collector, the same in
# every environment (AD-13). Query text goes on spans only when recordQueryText is true.
telemetry:
  otlpEndpoint: "http://otel-collector.platform.svc:4318"
  recordQueryText: false

# Embeddings (AD-21). `modelId` names the model baked into the app image; it equals the
# Dockerfile's EMBEDDING_MODEL_ID. Two sources, and a pinned asset always wins:
#   - assetVersion and sha256 pin the embedding asset, a `embeddings-<assetVersion>-<model>-
#     <preprocessing>` Release that scripts/publish-snapshot.sh builds from the pinned
#     snapshot. load downloads it, checks the checksum and loads the vectors; it computes
#     nothing. assetVersion is the snapshot version the asset was built from and must equal
#     snapshot.version. Both are set here only (AD-25), by a person, after publishing.
#   - with no pin, computeOnKind true makes load compute them with the baked model (kind
#     only, scripts/kind-up.sh EMBEDDINGS_COMPUTE=1).
# With neither, no model env is set, api is Ready on a keyword-only corpus and dense is
# unavailable.
embeddings:
  computeOnKind: false
  modelId: "BAAI/bge-small-en-v1.5"
  assetVersion: "2026.11.1"
  sha256: "8fd7a90937d1e93dc0ff50a8b4909bfb53cff76bbe6c33375e7dbaf41b9fddba"
  # The load Job's memory limit when it computes embeddings (jobs.resources otherwise).
  loadMemoryLimit: 2Gi

api:
  replicas: 1
  # Sized from the model's measured needs (bge-small-en-v1.5, story 3.6), measured on the
  # kind api pod: memory peaked at 288 MB (275 MiB, cgroup memory.peak) from a fresh start through
  # 60 dense searches and one default-mode search, with no OOM events. The model itself adds about
  # 130-185 MB over the process baseline (spike 3.3). The 512Mi limit is about 1.9 times the
  # peak and leaves room for the eval test's second process in this container.
  # CPU: a dense search embeds its query on the CPU, about 80-134 ms end to end (hybrid 81 ms,
  # keyword 20 ms), measured under the 1-core limit, so a request is one core for a fraction of a second.
  # Embedding time: 35.7 ms per issue, 1,146 s for the 32,153-issue snapshot, which is why
  # embeddings come from the pinned asset and load never computes them (spike 3.3).
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

# Resources for the migrate and load Jobs. With the pinned asset, load only downloads and inserts vectors: it
# completed in 16 s on kind within the 512Mi limit (story 3.6); it embeds nothing.
# embeddings.loadMemoryLimit applies only when computeOnKind embeds the corpus.
jobs:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  # How long migrate waits for the Cluster and the ticketscope_ro role.
  dbWaitTimeoutSeconds: 900

# The eval Job (epic-eval-gate, AD-22): a hook after load that scores every available
# mode on eval/pairs as ticketscope_ro. Only eval.yml's kind cluster enables it.
# With embeddings on, the Job loads the baked model and embeds every query's text live, so
# dense and hybrid p95 include the model (epic 3 story 5). It needs more memory than the
# other jobs. The deadline covers all three modes over every pair: story 3.5 measured
# 1475 s on kind (Docker Desktop), so 2700 s leaves room for a slower CI runner.
eval:
  enabled: false
  activeDeadlineSeconds: 2700
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

database:
  instances: 2
  storage:
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# Backups through the Barman Cloud Plugin (AD-18): an ObjectStore, and the
# Cluster's plugin WAL archiver. The endpoint, destination path and credential
# source are environment facts (AD-25), set in values-<env>.yaml.
backup:
  enabled: true
  objectStoreName: ticketscope-backup
  # s3://<bucket>/<prefix>; required when enabled.
  destinationPath: ""
  # Empty for AWS S3; the S3-compatible endpoint otherwise (SeaweedFS on kind).
  endpointURL: ""
  retentionPolicy: "7d"
  wal:
    compression: gzip
  credentials:
    # EKS: the Cluster's service account assumes an IRSA role; no keys.
    inheritFromIAMRole: false
    # kind: copy the keys from a chart-generated Secret in another namespace into
    # ticketscope-backup-s3 here, at render time (the platform release installs first, AD-22).
    copyFrom:
      namespace: ""
      secret: ""
      accessKeyIdKey: ""
      secretAccessKeyKey: ""
