# Defaults for the ticketscope release (AD-25). Environment facts live in
# values-<env>.yaml; image tags (the git SHA, AD-16) are set at install time.

image:
  app:
    repository: ticketscope-app
    tag: ""
  postgres:
    repository: ticketscope-postgres
    tag: ""
  pullPolicy: IfNotPresent

# Public hostname on the Gateway listener and the routes; set per environment.
hostname: ""

# The platform release's Gateway that the routes attach to (AD-14).
gateway:
  name: ticketscope
  namespace: platform

retrieval:
  # Server default when a request omits `mode` (AD-4, AD-25). Owned by epic 3.
  defaultMode: keyword

snapshot:
  # The pinned snapshot version that load reads (AD-6). Story 5 swaps in a real one.
  version: fixture

api:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

jobs:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  # How long migrate waits for the Cluster and the ticketscope_ro role.
  dbWaitTimeoutSeconds: 900

database:
  instances: 2
  storage:
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
