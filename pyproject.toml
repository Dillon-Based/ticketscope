[project]
name = "ticketscope"
version = "0.1.0"
description = "Similar-issue search over Mojang bug-tracker issues (The Public Jira Dataset v7), a personal project deployed and operated on Kubernetes."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi~=0.162.0",
    "httpx2~=2.16.0",
    "pydantic~=2.14.3",
    "pydantic-settings~=2.16",
    "psycopg[binary]~=3.3.8",
    "uvicorn~=0.54.0",
    "opentelemetry-sdk~=1.45.2",
    "opentelemetry-exporter-otlp-proto-http~=1.45.2",
    "opentelemetry-instrumentation-fastapi~=0.66b2",
    "opentelemetry-instrumentation-psycopg~=0.66b2",
    "fastembed~=0.9.1",
    "mcp~=2.3.0",
]

[project.scripts]
ticketscope-api = "ticketscope.http.app:main"
ticketscope-mcp = "ticketscope.mcp.main:main"
ticketscope-migrate = "ticketscope.jobs.migrate.main:main"
ticketscope-load = "ticketscope.jobs.load.main:main"
ticketscope-eval = "ticketscope.jobs.eval.main:main"
ticketscope-ingest = "ticketscope.jobs.ingest.main:main"

[dependency-groups]
# Person-run ingest and publish (AD-6): never in the app image, which syncs with --no-dev.
ingest = [
    "jsonschema~=4.26",
    "pymongo~=4.19",
]
dev = [
    { include-group = "ingest" },
    "import-linter~=2.15.0",
    "pyright~=1.1.414",
    "pytest~=9.2",
    "ruff~=0.17.4",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
# Vendored tooling (BMad, agent skills) is not ours to lint or format.
extend-exclude = ["_bmad", "_bmad-output", ".agents", ".claude", ".codex"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
strict = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not kind'"
markers = [
  "kind: needs the kind cluster and its Gateway; run with -m kind",
  "criterion(id, ...): qualified acceptance-criterion ids this test establishes; written to JUnit as properties for scripts/live_results.py",
]
